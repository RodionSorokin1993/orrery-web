version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Major versions are planned upgrades with their own spec, not routine bumps.
    # TypeScript 7 and ESLint 10 also wait for typescript-eslint and the React ESLint plugins,
    # and @types/node follows the Node 22 runtime.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      next-and-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next']
      sanity:
        patterns: ['sanity', '@sanity/*', 'next-sanity']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', '@playwright/test', '@axe-core/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
